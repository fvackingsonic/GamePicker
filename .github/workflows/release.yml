name: Build Windows exe

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Live Steam API check (отзывы и магазин отвечают JSON)
        run: |
          python -c "import steam_api as s, summarizer as m; r=s.app_reviews(9200,'all',20,'russian'); print('reviews', len(r['reviews']), r['query_summary'].get('review_score_desc'), r['query_summary'].get('total_reviews')); assert r['reviews']; d=s.store_details(9200,'ua','ru'); print('store', d and d.get('name'), d and d.get('price_overview')); x=m.summarize(895400,'Deadside','ru'); print('summary', x['pct'], x['total'], x['pros'], x['cons'])"

      - name: Build GamePicker.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GamePicker
          --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "static;static"
          --add-data "assets;assets"
          --collect-all webview
          app.py

      - name: Smoke test (server starts and answers)
        shell: pwsh
        run: |
          $p = Start-Process dist\GamePicker.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Name GamePicker -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "GamePicker.exe did not start" }
          (Get-Item dist\GamePicker.exe).Length / 1MB

      - name: Window-mode test (как при двойном клике)
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item "$env:APPDATA\GamePicker\gamepicker.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\GamePicker.exe -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; $ping = $r.ok } catch { $ping = $false }
          "alive=$alive ping=$ping"
          Get-Content "$env:APPDATA\GamePicker\gamepicker.log" -ErrorAction SilentlyContinue
          Stop-Process -Name GamePicker -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -like "msedgewebview2*" } | Measure-Object | Select-Object -ExpandProperty Count
          if (-not ($alive -and $ping)) { throw "window mode failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: GamePicker-exe
          path: dist/GamePicker.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GamePicker v${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/GamePicker.exe
          body_path: build/release_notes.md
