name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build GamePicker.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GamePicker
          --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "static;static"
          --add-data "assets;assets"
          --collect-all webview
          app.py

      - name: Smoke test (server starts and answers)
        shell: pwsh
        run: |
          $p = Start-Process dist\GamePicker.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "GamePicker.exe did not start" }
          (Get-Item dist\GamePicker.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: GamePicker-exe
          path: dist/GamePicker.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GamePicker ${{ github.ref_name }}
          files: dist/GamePicker.exe
          body_path: build/release_notes.md
