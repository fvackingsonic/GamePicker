name: Build Windows exe

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Live Steam check (отзывы, магазин, трейлер через прокси)
        env:
          PYTHONIOENCODING: utf-8
        run: python build/ci_check.py

      - name: Bundle hls.js (плеер трейлеров)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force static/vendor | Out-Null
          Invoke-WebRequest https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js -OutFile static/vendor/hls.min.js
          (Get-Item static/vendor/hls.min.js).Length

      - name: Build GamePicker.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GamePicker
          --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "static;static"
          --add-data "assets;assets"
          --collect-all webview
          app.py

      - name: Smoke test (server starts and answers)
        shell: pwsh
        run: |
          $p = Start-Process dist\GamePicker.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Name GamePicker -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "GamePicker.exe did not start" }
          (Get-Item dist\GamePicker.exe).Length / 1MB

      - name: Window-mode test (как при двойном клике)
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item "$env:APPDATA\GamePicker\gamepicker.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\GamePicker.exe -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; $ping = $r.ok } catch { $ping = $false }
          "alive=$alive ping=$ping"
          try { $w = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"url":"https://www.tiktok.com/search/video?q=Hades","title":"TikTok: Hades"}' http://127.0.0.1:8765/api/window; "tiktok_window_opened=$($w.opened)" } catch { "tiktok_window_error=$_" }
          Start-Sleep -Seconds 4
          Get-Content "$env:APPDATA\GamePicker\gamepicker.log" -ErrorAction SilentlyContinue
          Stop-Process -Name GamePicker -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -like "msedgewebview2*" } | Measure-Object | Select-Object -ExpandProperty Count
          if (-not ($alive -and $ping)) { throw "window mode failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: GamePicker-exe
          path: dist/GamePicker.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GamePicker v${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/GamePicker.exe
          body_path: build/release_notes.md

      - name: Self-update test (старая версия сама обновляется до новой)
        shell: pwsh
        env:
          GAMEPICKER_FAKE_VERSION: "1.0.0"
          GAMEPICKER_GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "gp"; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\GamePicker.exe "$dir\GamePicker.exe"
          Start-Process "$dir\GamePicker.exe" -ArgumentList "--no-browser" | Out-Null
          $base = "http://127.0.0.1:8765"
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 1; try { $v = (Invoke-RestMethod "$base/api/ping").version; if ($v) { break } } catch {} }
          "running version: $v"
          $u = Invoke-RestMethod "$base/api/update?force=1"; "update available=$($u.available) latest=$($u.version) can_install=$($u.can_install) error=$($u.error)"
          if (-not $u.available) { throw "update not detected" }
          Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "$base/api/update/download" | Out-Null
          for ($i = 0; $i -lt 120; $i++) { Start-Sleep 1; $st = (Invoke-RestMethod "$base/api/update").download; if ($st.status -ne "downloading") { break } }
          "download: $($st.status) $($st.error)"
          if ($st.status -ne "ready") { throw "download failed" }
          Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "$base/api/update/apply" | Out-Null
          $new = $null
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 1; try { $new = (Invoke-RestMethod "$base/api/ping").version; if ($new -and $new -ne "1.0.0") { break } } catch {} }
          "after update: $new"
          Get-ChildItem $dir | Format-Table Name, Length
          Get-Content "$env:APPDATA\GamePicker\gamepicker.log" -Tail 15 -ErrorAction SilentlyContinue
          Stop-Process -Name GamePicker -Force -ErrorAction SilentlyContinue
          if ($new -ne "${{ steps.ver.outputs.version }}") { throw "self-update did not restart into the new version" }
