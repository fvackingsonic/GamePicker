<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GamePicker</title>
  <link rel="icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // тема до отрисовки, чтобы не мигало
    try { var th = JSON.parse(localStorage.getItem("gp.theme") || '"auto"'); if (th !== "auto") document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="wordmark" aria-label="GamePicker">
      <span class="wm-main">Game<br>Picker</span>
      <span class="wm-ghost" aria-hidden="true">Game<br>Picker</span>
    </div>
    <p class="masthead-line" data-i18n="tagline"></p>
    <div class="masthead-tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button><button data-lang="uk">UK</button><button data-lang="en">EN</button>
      </div>
      <div class="theme" role="group" id="theme">
        <button data-theme-btn="auto" data-i18n-title="theme_auto"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button><button data-theme-btn="light" data-i18n-title="theme_light"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></g></svg></button><button data-theme-btn="dark" data-i18n-title="theme_dark"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      </div>
      <button class="btn-ink small" id="btn-settings" data-i18n="settings"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" class="tab on" data-tab="picks" data-i18n="tab_picks"></button>
    <button role="tab" class="tab" data-tab="hidden"><span data-i18n="tab_hidden"></span> <span class="tab-count" id="hidden-count"></span></button>
  </nav>

  <!-- ============ Подбор ============ -->
  <main class="sheet" id="view-picks">
    <aside class="panel">
      <section class="taste" id="lib-card" hidden>
        <p class="taste-line" id="taste-line"></p>
        <div class="taste-tags" id="lib-tags"></div>
        <details class="taste-games">
          <summary data-i18n="top_games"></summary>
          <ol id="lib-games"></ol>
        </details>
        <button class="link" id="btn-refresh" data-i18n="refresh"></button>
      </section>

      <section class="controls">
        <div class="switch" id="mode">
          <button data-mode="library" class="on" data-i18n="mode_library"></button>
          <button data-mode="tags" data-i18n="mode_tags"></button>
        </div>
        <p class="hint" id="mode-hint"></p>

        <h2 class="ctl-title" data-i18n="categories"></h2>
        <p class="hint" data-i18n="tags_help"></p>
        <input id="tag-search" class="field" data-i18n-ph="tag_search">
        <div id="tag-chips" class="chips"></div>
        <div id="match-wrap" class="switch small" hidden>
          <button data-match="any" class="on" data-i18n="match_any"></button>
          <button data-match="all" data-i18n="match_all"></button>
        </div>

        <h2 class="ctl-title" data-i18n="filters"></h2>
        <div class="grid2">
          <label><span data-i18n="max_price"></span><input type="number" min="0" step="1" id="f-price" class="field" data-i18n-ph="max_price_ph"></label>
          <label><span data-i18n="count"></span><input type="number" min="3" max="30" value="12" id="f-count" class="field"></label>
        </div>
        <label class="range-row"><span data-i18n="min_rating"></span>
          <span class="range"><input type="range" min="0" max="95" step="5" value="75" id="f-rating"><b id="f-rating-v">75%</b></span></label>
        <label><span data-i18n="min_reviews"></span><input type="number" min="0" step="10" value="100" id="f-reviews" class="field"></label>

        <label class="toggle gem-toggle"><input type="checkbox" id="f-gems"><span class="tg"></span>
          <span><b data-i18n="gems"></b><small data-i18n="gems_hint"></small></span></label>
        <label class="toggle"><input type="checkbox" id="f-discount"><span class="tg"></span><span data-i18n="discount_only"></span></label>
        <label class="toggle"><input type="checkbox" id="f-free"><span class="tg"></span><span data-i18n="free_only"></span></label>

        <button class="btn-big" id="btn-find" data-i18n="find"></button>
      </section>
    </aside>

    <section class="results">
      <div id="progress" class="press" hidden>
        <div class="press-bar"><i id="progress-bar"></i></div>
        <p id="progress-text"></p>
        <p class="hint" data-i18n="first_run"></p>
      </div>
      <div id="error" class="alert" hidden></div>
      <p id="results-meta" class="hint"></p>
      <div id="results" class="tickets"></div>
      <div id="placeholder" class="empty">
        <p class="empty-title" id="placeholder-title"></p>
        <p class="hint" id="placeholder-text"></p>
      </div>
      <button class="btn-ink wide" id="btn-more" hidden data-i18n="more"></button>
    </section>
  </main>

  <!-- ============ Скрытые ============ -->
  <main class="sheet single" id="view-hidden" hidden>
    <section class="hidden-view">
      <div class="hidden-head">
        <div>
          <h2 class="view-title" data-i18n="hidden_title"></h2>
          <p class="hint" data-i18n="hidden_text"></p>
        </div>
        <div class="switch" id="hidden-filter">
          <button data-reason="" class="on" data-i18n="hf_all"></button>
          <button data-reason="not_interested" data-i18n="hf_not_interested"></button>
          <button data-reason="owned" data-i18n="hf_owned"></button>
        </div>
      </div>
      <ul class="hidden-list" id="hidden-list"></ul>
      <div class="empty" id="hidden-empty" hidden><p class="empty-title" data-i18n="hidden_empty"></p></div>
      <button class="link" id="btn-unhide-all" data-i18n="restore_all"></button>
    </section>
  </main>

  <!-- ============ Настройки ============ -->
  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2 class="view-title" data-i18n="setup_title"></h2>
      <p class="hint" data-i18n="setup_text"></p>
      <label><span data-i18n="f_key"></span>
        <input name="steam_api_key" class="field" autocomplete="off" spellcheck="false">
        <small data-i18n="f_key_hint"></small></label>
      <label><span data-i18n="f_profile"></span>
        <input name="steam_profile" class="field" placeholder="https://steamcommunity.com/id/…" spellcheck="false">
        <small data-i18n="f_profile_hint"></small></label>
      <label><span data-i18n="f_country"></span>
        <select name="country" class="field">
          <option value="ua">Україна (₴)</option><option value="us">USA ($)</option>
          <option value="eu">Europe (€)</option><option value="pl">Polska (zł)</option>
          <option value="kz">Қазақстан (₸)</option><option value="gb">UK (£)</option>
          <option value="tr">Türkiye ($)</option>
        </select></label>

      <details class="fold" id="family-fold">
        <summary><span data-i18n="family_title"></span> <span class="fold-status" id="family-status"></span></summary>
        <p class="hint" data-i18n="family_text"></p>
        <ol class="steps">
          <li><span data-i18n="family_step1"></span><br>
            <a href="https://store.steampowered.com/pointssummary/ajaxgetasyncconfig" target="_blank" rel="noopener" class="mono-link">store.steampowered.com/pointssummary/ajaxgetasyncconfig</a></li>
          <li data-i18n="family_step2"></li>
        </ol>
        <textarea id="family-token" class="field" rows="3" spellcheck="false" placeholder='{"success":1,"data":{"webapi_token":"…"}}'></textarea>
        <div class="row">
          <button type="button" class="btn-ink small" id="btn-family" data-i18n="family_import"></button>
          <button type="button" class="link" id="btn-family-clear" data-i18n="family_clear"></button>
        </div>
        <p class="hint" id="family-msg"></p>
      </details>

      <details class="fold">
        <summary data-i18n="f_ai_key"></summary>
        <label><input name="anthropic_api_key" class="field" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
          <small data-i18n="f_ai_hint"></small></label>
        <label><span data-i18n="f_workspace"></span><input name="anthropic_workspace" class="field" placeholder="wrkspc_…" spellcheck="false">
          <small data-i18n="f_workspace_hint"></small></label>
        <label><span data-i18n="f_model"></span><input name="claude_model" class="field"></label>
      </details>

      <p class="alert small" id="settings-err" hidden></p>
      <div class="row end">
        <button type="button" class="link" id="settings-cancel" data-i18n="cancel"></button>
        <button type="submit" class="btn-big" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- ============ Просмотр скриншотов и видео ============ -->
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <p class="viewer-title" id="viewer-title"></p>
      <p class="viewer-count" id="viewer-count"></p>
      <button class="viewer-close" id="viewer-close" data-i18n-title="close">✕</button>
    </div>
    <div class="viewer-stage">
      <button class="viewer-nav prev" id="viewer-prev" data-i18n-title="prev">‹</button>
      <div class="viewer-media" id="viewer-media"></div>
      <button class="viewer-nav next" id="viewer-next" data-i18n-title="next">›</button>
    </div>
    <div class="viewer-thumbs" id="viewer-thumbs"></div>
  </dialog>

  <template id="ticket-tpl">
    <article class="ticket">
      <a class="cover" target="_blank" rel="noopener"><img loading="lazy" alt=""></a>
      <div class="stickers"></div>
      <div class="media-strip" hidden></div>
      <div class="t-body">
        <h3 class="t-name"></h3>
        <p class="t-sub"></p>
        <p class="t-desc"></p>
        <p class="note"></p>
        <div class="t-tags"></div>
        <div class="summary" hidden></div>
      </div>
      <div class="perf" aria-hidden="true"></div>
      <div class="stub">
        <div class="stub-price"></div>
        <div class="stub-score"></div>
        <div class="stub-actions">
          <button class="btn-ink small act-summary"></button>
          <a class="chip-link act-steam" target="_blank" rel="noopener">Steam</a>
          <a class="chip-link act-app"></a>
          <span class="quiet"><button class="link act-owned"></button><button class="link act-hide"></button></span>
        </div>
      </div>
    </article>
  </template>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
