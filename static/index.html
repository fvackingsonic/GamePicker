<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GamePicker</title>
  <link rel="icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    try { var th = JSON.parse(localStorage.getItem("gp.theme") || '"auto"'); if (th !== "auto") document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <!-- ============ Верх ============ -->
  <header class="top pywebview-drag-region" id="top">
    <img class="logo pywebview-drag-region" src="/icon.png" alt="GamePicker">
    <nav class="nav" role="tablist">
      <button role="tab" class="on" data-view="picks" data-i18n="tab_picks"></button>
      <button role="tab" data-view="taste" data-i18n="tab_taste"></button>
      <button role="tab" data-view="hidden"><span data-i18n="tab_hidden"></span><b class="count" id="hidden-count"></b></button>
    </nav>
    <div class="grow pywebview-drag-region" id="drag"></div>
    <div class="seg-mini" id="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button><button data-lang="uk">UK</button><button data-lang="en">EN</button>
    </div>
    <button class="ico" id="btn-theme"></button>
    <button class="ico" id="btn-settings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
    <div class="winbtns" id="winbtns" hidden>
      <button data-win="min" data-i18n-title="win_min"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button data-win="max" data-i18n-title="win_max" id="win-max"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="2" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button data-win="close" class="close" data-i18n-title="win_close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <!-- ============ Подбор ============ -->
  <main class="view picks" id="view-picks">
    <section class="stage">
      <div class="bar">
        <div class="seg" id="mode">
          <button data-mode="library" data-i18n="mode_library"></button>
          <button data-mode="games" data-i18n="mode_games"></button>
          <button data-mode="tags" data-i18n="mode_tags"></button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zM16 16l5 5"/></svg>
          <input id="seed-input" autocomplete="off" spellcheck="false" data-i18n-ph="search_ph">
          <ul class="dropdown" id="seed-results" hidden></ul>
        </div>
      </div>

      <div class="seeds-row" id="seeds-row" hidden></div>

      <div class="chips" id="chips">
        <button class="chip" data-pop="price"><span data-i18n="chip_price"></span><small id="chip-price-v"></small></button>
        <button class="chip" data-pop="rating"><span data-i18n="chip_rating"></span><small id="chip-rating-v"></small></button>
        <button class="chip" data-pop="tags"><span data-i18n="chip_tags"></span><small id="chip-tags-v"></small></button>
        <button class="chip" data-toggle="discount_only" data-i18n="chip_sale"></button>
        <button class="chip" data-toggle="gems" data-i18n="chip_gems"></button>
        <button class="chip" data-pop="more"><span data-i18n="chip_more"></span><small id="chip-more-v"></small></button>
        <button class="chip ghost" id="btn-reset" hidden data-i18n-title="reset_all"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2M3.5 2.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="reset_all"></span></button>
        <button class="go" id="btn-find" data-i18n="find"></button>
      </div>

      <div class="alert" id="error" hidden></div>
      <p class="meta" id="results-meta"></p>

      <div class="scroll" id="grid-scroll">
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">
          <div class="empty-art" aria-hidden="true"><i></i><i></i><i></i></div>
          <p class="empty-title" id="empty-title"></p>
          <p class="empty-text" id="empty-text"></p>
        </div>
        <button class="more-btn" id="btn-more" hidden data-i18n="more"></button>
      </div>
    </section>

    <aside class="side" id="side">
      <div class="side-empty" id="side-empty"><p data-i18n="side_hint"></p></div>
      <div class="side-body" id="side-body" hidden>
        <div class="hero" id="hero"></div>
        <div class="strip" id="strip"></div>
        <div class="sb">
          <div class="title-row">
            <h2 class="title" id="s-title"></h2>
            <div class="acts-row" id="s-acts"></div>
          </div>
          <p class="dev" id="s-dev"></p>
          <div class="buy">
            <span class="p" id="s-price"></span>
            <a class="btn primary" id="s-steam" target="_blank" rel="noopener" data-i18n="open_steam"></a>
            <button class="btn" id="s-tiktok" data-i18n-title="tiktok_hint">TikTok</button>
          </div>
          <p class="desc" id="s-desc"></p>
          <div class="group" id="s-facts"></div>
          <div class="group" id="s-reviews"></div>
          <div class="tags" id="s-tags"></div>
          <a class="client-link" id="s-client" data-i18n="open_app"></a>
        </div>
      </div>
    </aside>
  </main>

  <!-- ============ Мой вкус ============ -->
  <main class="view single" id="view-taste" hidden>
    <section class="page">
      <h1 class="page-title" data-i18n="tab_taste"></h1>
      <p class="page-lead" id="taste-line"></p>
      <div class="group">
        <div class="h" data-i18n="your_tags"></div>
        <p class="cell-hint" data-i18n="taste_tags_hint"></p>
        <div class="tag-cloud" id="taste-tags"></div>
      </div>
      <div class="group">
        <div class="h" data-i18n="top_games"></div>
        <div id="taste-games"></div>
      </div>
      <div class="row"><button class="btn" id="btn-refresh" data-i18n="refresh"></button></div>
    </section>
  </main>

  <!-- ============ Скрытые ============ -->
  <main class="view single" id="view-hidden" hidden>
    <section class="page">
      <h1 class="page-title" data-i18n="hidden_title"></h1>
      <p class="page-lead" data-i18n="hidden_text"></p>
      <div class="seg" id="hidden-filter">
        <button data-reason="" class="on" data-i18n="hf_all"></button>
        <button data-reason="not_interested" data-i18n="hf_not_interested"></button>
        <button data-reason="owned" data-i18n="hf_owned"></button>
      </div>
      <div class="group" id="hidden-list"></div>
      <p class="empty-text" id="hidden-empty" data-i18n="hidden_empty"></p>
      <button class="link" id="btn-unhide-all" data-i18n="restore_all"></button>
    </section>
  </main>

  <!-- ============ Низ ============ -->
  <footer class="foot">
    <span id="status"></span>
    <span class="prog" id="prog" hidden><i id="prog-bar"></i></span>
    <span class="grow"></span>
    <button class="upd" id="upd" hidden></button>
    <span class="ver" id="ver"></span>
  </footer>
</div>

<div class="pop" id="pop" hidden></div>

<!-- края для изменения размера окна без рамки -->
<div class="edges" id="edges" hidden>
  <i data-edge="n"></i><i data-edge="s"></i><i data-edge="e"></i><i data-edge="w"></i>
  <i data-edge="ne"></i><i data-edge="nw"></i><i data-edge="se"></i><i data-edge="sw"></i>
</div>

<!-- ============ Лента TikTok ============ -->
<dialog id="tt" aria-labelledby="tt-title">
  <div class="tt-head">
    <span class="tt-logo" aria-hidden="true">♪</span>
    <p class="tt-title" id="tt-title"></p>
    <span class="tt-meta" id="tt-meta"></span>
    <span class="tt-count" id="tt-count"></span>
    <button class="ico" id="tt-close" data-i18n-title="close">✕</button>
  </div>
  <div class="tt-body">
    <div class="tt-phone" id="tt-phone"></div>
    <div class="tt-nav">
      <button class="ico" id="tt-prev" data-i18n-title="tt_prev"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ico" id="tt-next" data-i18n-title="tt_next"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <p class="tt-hint" data-i18n="tt_hint"></p>
</dialog>

<!-- ============ Настройки ============ -->
<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2 class="dlg-title" data-i18n="setup_title"></h2>
    <p class="hint" data-i18n="setup_text"></p>
    <label><span data-i18n="f_key"></span>
      <input name="steam_api_key" class="field" autocomplete="off" spellcheck="false">
      <small data-i18n="f_key_hint"></small></label>
    <label><span data-i18n="f_profile"></span>
      <input name="steam_profile" class="field" placeholder="https://steamcommunity.com/id/…" spellcheck="false">
      <small data-i18n="f_profile_hint"></small></label>
    <label><span data-i18n="f_country"></span>
      <select name="country" class="field">
        <option value="ua">Україна (₴)</option><option value="us">USA ($)</option>
        <option value="eu">Europe (€)</option><option value="pl">Polska (zł)</option>
        <option value="kz">Қазақстан (₸)</option><option value="gb">UK (£)</option>
        <option value="tr">Türkiye ($)</option>
      </select></label>

    <details class="fold" id="family-fold">
      <summary><span data-i18n="family_title"></span> <span class="fold-status" id="family-status"></span></summary>
      <p class="hint" data-i18n="family_text"></p>
      <ol class="steps">
        <li><span data-i18n="family_step1"></span><br>
          <a href="https://store.steampowered.com/pointssummary/ajaxgetasyncconfig" target="_blank" rel="noopener" class="ext">store.steampowered.com/pointssummary/ajaxgetasyncconfig</a></li>
        <li data-i18n="family_step2"></li>
      </ol>
      <textarea id="family-token" class="field" rows="3" spellcheck="false" placeholder='{"success":1,"data":{"webapi_token":"…"}}'></textarea>
      <div class="row">
        <button type="button" class="btn" id="btn-family" data-i18n="family_import"></button>
        <button type="button" class="link" id="btn-family-clear" data-i18n="family_clear"></button>
      </div>
      <p class="hint" id="family-msg"></p>
    </details>

    <details class="fold">
      <summary data-i18n="f_ai_key"></summary>
      <label><input name="anthropic_api_key" class="field" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        <small data-i18n="f_ai_hint"></small></label>
      <label><span data-i18n="f_workspace"></span><input name="anthropic_workspace" class="field" placeholder="wrkspc_…" spellcheck="false">
        <small data-i18n="f_workspace_hint"></small></label>
      <label><span data-i18n="f_model"></span><input name="claude_model" class="field"></label>
    </details>

    <div class="row between about">
      <span class="hint" id="about-version"></span>
      <button type="button" class="link" id="btn-check-update" data-i18n="check_update"></button>
    </div>
    <p class="alert" id="settings-err" hidden></p>
    <div class="row end">
      <button type="button" class="btn" id="settings-cancel" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<!-- ============ Просмотр скриншотов и видео ============ -->
<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-head">
    <p class="viewer-title" id="viewer-title"></p>
    <p class="viewer-count" id="viewer-count"></p>
    <button class="ico" id="viewer-close" data-i18n-title="close">✕</button>
  </div>
  <div class="viewer-stage">
    <button class="viewer-nav" id="viewer-prev" data-i18n-title="prev">‹</button>
    <div class="viewer-media" id="viewer-media"></div>
    <button class="viewer-nav" id="viewer-next" data-i18n-title="next">›</button>
  </div>
  <div class="viewer-thumbs" id="viewer-thumbs"></div>
</dialog>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
